<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك جيهان - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .geometric-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.08;
            z-index: -1;
            background-image: 
                linear-gradient(45deg, transparent 48%, #333 49%, #333 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #333 49%, #333 51%, transparent 52%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            background: url('https://c.top4top.io/p_3925eoedz1.jpeg') center/contain no-repeat;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 35px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
            animation: slideInForm 0.6s ease-out backwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        @keyframes slideInForm {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s ease;
            background: #f9f9f9;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #c41e3a;
            background: white;
            box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.1);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #bbb;
        }

        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 18px;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #c41e3a;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #666;
            margin: 0;
        }

        .remember-forgot input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #c41e3a;
        }

        .remember-forgot a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            text-transform: none;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #ccc;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 12px;
            color: #999;
        }

        .auth-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .auth-btn {
            padding: 12px 16px;
            background: #4a5568;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: none;
            letter-spacing: 0.3px;
        }

        .auth-btn:hover {
            background: #3a4558;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 85, 104, 0.3);
        }

        .auth-btn.create {
            grid-column: 2;
        }

        .auth-btn.client {
            grid-column: 1;
        }

        .footer-links {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .footer-links a {
            color: #c41e3a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #a01830;
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .title {
                font-size: 28px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 12px 14px;
                font-size: 14px;
            }

            .login-btn {
                padding: 12px;
                font-size: 15px;
            }

            .auth-btn {
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        /* Loading State */
        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .login-btn.loading::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Input Focus Animation */
        input:focus + label {
            color: #c41e3a;
        }
    </style>
</head>
<body>
    <div class="geometric-pattern"></div>

    <div class="login-container">
        <div class="logo-container">
            <div class="logo"></div>
        </div>

        <h1 class="title">تسجيل الدخول</h1>

        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="الرجاء إدخال اسم المستخدم" 
                        required
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="الرجاء إدخال كلمة المرور" 
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        👁️
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="remember">
                    تذكر كلمة المرور وعرض اسم المستخدم
                </label>
                <a href="#" onclick="handleForgot(event)">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
        </form>

        <div class="divider">
            <span>أو</span>
        </div>

        <div class="auth-options">
            <button class="auth-btn client" onclick="handleNewClient(event)">أصبح عميل</button>
            <button class="auth-btn create" onclick="handleCreateAccount(event)">إنشاء حساب</button>
        </div>

        <div class="footer-links">
            <a href="#" onclick="handleTerms(event)">الشروط والأحكام</a>
        </div>
    </div>

    <script>
        // Password Toggle
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            passwordToggle.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        });

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            // Add loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                alert(`تم تسجيل الدخول بنجاح\nاسم المستخدم: ${username}`);
                
                // Reset form
                document.getElementById('loginForm').reset();
            }, 1500);
        });

        // Handle Forgot Password
        function handleForgot(e) {
            e.preventDefault();
            alert('سيتم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
        }

        // Handle New Client
        function handleNewClient(e) {
            e.preventDefault();
            alert('شكراً! سيتم تحويلك إلى صفحة التسجيل كعميل جديد');
        }

        // Handle Create Account
        function handleCreateAccount(e) {
            e.preventDefault();
            alert('شكراً! سيتم تحويلك إلى صفحة إنشاء حساب جديد');
        }

        // Handle Terms
        function handleTerms(e) {
            e.preventDefault();
            alert('اطلع على شروط واستخدام الخدمة');
        }

        // Save Remember Me
        const rememberCheckbox = document.getElementById('remember');
        const usernameInput = document.getElementById('username');

        // Load saved username if exists
        window.addEventListener('load', () => {
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberCheckbox.checked = true;
            }
        });

        // Save username on form submit
        rememberCheckbox.addEventListener('change', () => {
            if (rememberCheckbox.checked && usernameInput.value) {
                localStorage.setItem('savedUsername', usernameInput.value);
            } else {
                localStorage.removeItem('savedUsername');
            }
        });

        // Update saved username on input change
        usernameInput.addEventListener('change', () => {
            if (rememberCheckbox.checked) {
                localStorage.setItem('savedUsername', usernameInput.value);
            }
        });
    </script>
</body>
</html>
